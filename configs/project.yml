project:
  name: water-stress-soybean
  version: "0.1.0"
  timezone: America/Sao_Paulo

study:
  area_type: state
  area_name: Mato Grosso
  area_code: "51"
  start_date: "2023-09-01"
  end_date: "2024-04-30"

ibge:
  base_url: https://servicodados.ibge.gov.br/api/v3/malhas
  quality: minima

nasa_power:
  point_url: https://power.larc.nasa.gov/api/temporal/daily/point
  regional_url: https://power.larc.nasa.gov/api/temporal/daily/regional
  community: AG
  time_standard: UTC
  regional_chunk_degrees: 10
  parameters:
    - T2M
    - T2M_MAX
    - T2M_MIN
    - RH2M
    - WS2M
    - ALLSKY_SFC_SW_DWN
    - PRECTOTCORR

soilgrids:
  base_url: https://maps.isric.org/mapserv
  service: WCS
  version: 2.0.1
  format: GEOTIFF_INT16
  source_crs: EPSG:4326
  subset_crs: ESRI:54052
  quantile: Q0.5
  properties:
    - clay
    - sand
    - soc
    - bdod
  depths:
    - 0-5cm
    - 5-15cm
    - 15-30cm
  chunk_size_meters: 250000

sentinel_2:
  search_url: https://earth-search.aws.element84.com/v1/search
  collection: sentinel-2-l2a
  max_cloud_cover: 30
  representative_scenes: 3
  page_limit: 100
  assets:
    - red
    - nir
    - swir16
    - scl
  download_bronze_assets: false

mapbiomas:
  base_url: https://storage.googleapis.com/mapbiomas-public/initiatives/brasil
  collection: 10
  reference_year: 2023
  soybean_class: 39
  license: CC-BY-4.0

spatial:
  query_crs: EPSG:4326
  area_crs: EPSG:5880
  screening_grid_meters: 1000
  detail_grid_meters: 250
  indicator_window_days: 7

gold:
  soy_fraction_threshold: 0.25
  satellite_max_age_days: 30
  deficit_reference_mm: 20
  ndvi_stress_threshold: 0.7
  ndmi_stress_threshold: 0.2
  deficit_weight: 0.5
  ndvi_weight: 0.3
  ndmi_weight: 0.2

http:
  timeout_seconds: 120
  max_attempts: 3
  backoff_seconds: 1

storage:
  root_path: data/bronze
  silver_root_path: data/silver
  gold_root_path: data/gold
