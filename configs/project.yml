project:
  name: water-stress-soybean
  version: "0.1.0"
  timezone: America/Sao_Paulo

study:
  municipality_name: Sorriso
  municipality_code: "5107925"
  start_date: "2023-09-01"
  end_date: "2024-04-30"

ibge:
  base_url: https://servicodados.ibge.gov.br/api/v3/malhas/municipios
  quality: minima

nasa_power:
  base_url: https://power.larc.nasa.gov/api/temporal/daily/point
  community: AG
  time_standard: UTC
  parameters:
    - T2M
    - T2M_MAX
    - T2M_MIN
    - RH2M
    - WS2M
    - ALLSKY_SFC_SW_DWN
    - PRECTOTCORR

soilgrids:
  base_url: https://maps.isric.org/mapserv
  service: WCS
  version: 2.0.1
  format: GEOTIFF_INT16
  source_crs: EPSG:4326
  subset_crs: ESRI:54052
  quantile: Q0.5
  properties:
    - clay
    - sand
    - soc
    - bdod
  depths:
    - 0-5cm
    - 5-15cm
    - 15-30cm

sentinel_2:
  search_url: https://earth-search.aws.element84.com/v1/search
  collection: sentinel-2-l2a
  max_cloud_cover: 30
  representative_scenes: 3
  page_limit: 100
  assets:
    - red
    - nir
    - swir16
    - scl

http:
  timeout_seconds: 120
  max_attempts: 3
  backoff_seconds: 1

storage:
  root_path: data/bronze
  silver_root_path: data/silver
