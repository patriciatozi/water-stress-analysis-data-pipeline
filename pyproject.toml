[project]
name = "water-stress-analysis-data-pipeline"
version = "0.1.0"
description = "Bronze ingestion pipeline for a soybean water-stress analysis MVP"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pyproj>=3.7,<4",
  "pyarrow>=17,<24",
  "pyyaml>=6.0,<7",
  "shapely>=2.0,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "pyarrow-stubs>=17,<24",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-pyyaml>=6.0,<7",
  "types-shapely>=2.0,<3",
]
notebook = [
  "jupyterlab>=4.2,<5",
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<3",
  "rasterio>=1.4,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/water_stress"]

[tool.pytest.ini_options]
addopts = "--cov=water_stress --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["water_stress"]
